# Blueprint Render — AgroSmart Insights (Sprint 1)
# Docs: https://render.com/docs/blueprint-spec
#
# Frontend → Vercel (src/frontend/vercel.json)
# Backend  → Render (n8n + Postgres)

databases:
  - name: agrosmart-postgres
    databaseName: agrosmart_db
    user: agrosmart
    plan: free
    ipAllowList: []

services:
  - type: web
    name: agrosmart-n8n
    runtime: image
    image:
      url: docker.n8n.io/n8nio/n8n:latest
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: N8N_HOST
        sync: false
      - key: N8N_PROTOCOL
        value: https
      - key: WEBHOOK_URL
        sync: false
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: agrosmart-postgres
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: agrosmart-postgres
          property: port
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: agrosmart-postgres
          property: database
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: agrosmart-postgres
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: agrosmart-postgres
          property: password
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: MAPTILER_API_KEY
        sync: false
      - key: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
        value: "true"
