# Blueprint Render — AgroSmart Insights (Sprint 1)
# Docs: https://render.com/docs/blueprint-spec
#
# Frontend → Vercel (src/frontend/agrosmart-frontend)
# Backend  → Render (n8n + Postgres)
#
# Plan free: ~512 MB RAM. n8n 2.37.10 validado en local (docker-compose):
# ~355 MB en reposo sin carga — vigilar el uso real en Render tras el deploy,
# por si hay que ajustar NODE_OPTIONS.

databases:
  - name: agrosmart-postgres
    databaseName: agrosmart_db
    user: agrosmart
    plan: free
    ipAllowList: []

services:
  - type: web
    name: agrosmart-n8n
    runtime: image
    image:
      url: docker.io/n8nio/n8n:2.37.10
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: N8N_HOST
        sync: false
      - key: N8N_PROTOCOL
        value: https
      - key: PORT
        value: "5678"
      - key: N8N_EDITOR_BASE_URL
        sync: false
      - key: N8N_WEBHOOK_URL
        sync: false
      - key: NODE_OPTIONS
        value: "--max-old-space-size=384"
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: agrosmart-postgres
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: agrosmart-postgres
          property: port
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: agrosmart-postgres
          property: database
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: agrosmart-postgres
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: agrosmart-postgres
          property: password
      - key: DB_POSTGRESDB_SCHEMA
        value: public
      - key: DB_POSTGRESDB_SSL_ENABLED
        value: "false"
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: MAPTILER_API_KEY
        sync: false
      - key: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
        value: "true"
      - key: N8N_OTEL_ENABLED
        value: "true"
      - key: N8N_AGENTS_TRACING_ENABLED
        value: "true"
      - key: N8N_OTEL_EXPORTER_OTLP_ENDPOINT
        value: "https://cloud.langfuse.com/api/public/otel"
      - key: N8N_OTEL_EXPORTER_OTLP_HEADERS
        sync: false # pegar en el panel de Render: Authorization=Basic <base64 pub:secret>,x-langfuse-ingestion-version=4
