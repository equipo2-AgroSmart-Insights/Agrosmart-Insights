name: Health Check Programado (Producción)
# Corre solo, sin depender de que alguien lo dispare a mano.
# Reutiliza infrastructure/scripts/health-check.sh (mismo script del deploy).

on:
  schedule:
    - cron: '0 */6 * * *' # cada 6 horas
  workflow_dispatch: {} # permite dispararlo manual desde la pestaña Actions

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    name: Verificar producción (n8n + frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Ejecutar health-check.sh contra producción
        env:
          N8N_URL: ${{ secrets.N8N_HEALTH_URL }}
          FRONTEND_URL: ${{ secrets.FRONTEND_HEALTH_URL }}
        run: |
          chmod +x infrastructure/scripts/health-check.sh
          ./infrastructure/scripts/health-check.sh

      - name: Avisar con un issue (si corrió por el cron, no manual)
        if: ${{ failure() && github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --label ci-health-check-failure --state open --json number --jq '.[0].number')
          BODY="El health-check programado falló: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Health check de producción fallando" --label ci-health-check-failure --body "$BODY"
          fi
