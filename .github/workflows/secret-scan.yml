name: Escaneo de Secretos (Gitleaks)
# Complementa a n8n-validate-ci.yml: ese solo audita src/n8n-workflows/*.json;
# este escanea TODO el repositorio (código, configs, historial del PR) en
# busca de credenciales, tokens y llaves expuestas.
#
# Usa el binario open source de Gitleaks directamente (no la Action de
# GitHub Marketplace: esa exige licencia paga para cuentas de organización
# desde 2025 — la herramienta en sí sigue siendo gratuita).

on:
  pull_request: {}
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1' # lunes 07:00 UTC

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # necesario para que Gitleaks revise el historial del PR

      - name: Descargar e instalar Gitleaks (binario open source)
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Escanear el repositorio
        run: gitleaks detect --source . --verbose --redact
