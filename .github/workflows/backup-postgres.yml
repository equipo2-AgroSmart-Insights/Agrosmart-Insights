name: Backup Automático de PostgreSQL (Producción)
# Origen: la base de Render (plan Free) no ofrece backups nativos y
# expira si no se actualiza a un plan pago. Este workflow saca un
# respaldo semanal sin depender de que alguien se acuerde de hacerlo
# a mano.
#
# Requiere el secret RENDER_DATABASE_URL (cadena de conexión externa
# de Render → Connect → External Connection String). Configurado y
# probado el 18/09/2026 (corrida manual exitosa) — activo.
#
# Nota: el "IP Allow List" de la base en Render se resetea a vacío en
# cada sincronización del Blueprint (ipAllowList: [] en render.yaml),
# bloqueando el acceso externo hasta que alguien lo vuelva a habilitar
# a mano en Render → Networking. Si este workflow empieza a fallar al
# conectar, revisar eso primero antes de sospechar del secret.

on:
  schedule:
    - cron: '0 8 * * 1' # lunes 08:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    name: pg_dump de producción
    runs-on: ubuntu-latest
    container:
      image: postgres:18 # misma versión mayor que Render, evita el mismatch de pg_dump
    env:
      # `secrets.X` directo dentro de un `if:` falla la validación del
      # workflow en cualquier disparador (confirmado: 50/50 corridas
      # fallidas en 0s desde el 13/10, también en backup-postgres.yml,
      # no solo en archivos nuevos) — GitHub no reconoce el contexto
      # `secrets` ahí. Se indirecciona por `env:` a nivel de job, que sí
      # está soportado en `if:`.
      HAS_DB_SECRET: ${{ secrets.RENDER_DATABASE_URL != '' }}
    steps:
      - name: Avisar si falta el secret
        if: ${{ env.HAS_DB_SECRET == 'false' }}
        run: |
          echo "::warning::RENDER_DATABASE_URL no está configurado todavía — se omite el backup. Agrégalo en Settings → Secrets para activarlo."

      - name: Generar el dump
        if: ${{ env.HAS_DB_SECRET == 'true' }}
        env:
          DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
        run: |
          pg_dump "$DATABASE_URL" --no-owner --no-privileges -f backup-render-postgres.sql

      - name: Subir el backup como artefacto
        if: ${{ env.HAS_DB_SECRET == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: backup-render-postgres-${{ github.run_id }}
          path: backup-render-postgres.sql
          retention-days: 30
