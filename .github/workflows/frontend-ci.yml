name: Frontend CI Pipeline

on:
  # Sin filtro de paths en pull_request: este job es required check en main.
  # Si no corre en un PR, GitHub queda en "Expected — Waiting for status".
  pull_request: {}
  push:
    branches:
      - main
    paths:
      - 'src/frontend/**'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

jobs:
  validate-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Verificar estructura de archivos del Frontend
        run: |
          echo "=== Verificando componentes del Microfrontend NLQ ==="
          if [ ! -d "src/frontend" ]; then
            echo "ℹ️ No se encontró la carpeta src/frontend. Se omite validación de frontend."
            exit 0
          fi
          echo "✅ Estructura de directorio validada."

      - name: Instalar dependencias y validar sintaxis (si aplica package.json)
        run: |
          # Antes este check solo validaba agrosmart-frontend (el shell) — los
          # 3 microfrontends (chat, monitoreo, mercados) nunca se compilaban
          # en CI. Un JSX roto en mercados-microfrontend (PR #152) llegó a
          # main sin que este "required check" lo detectara, porque
          # literalmente no miraba esa carpeta. Ahora valida los 4.
          PROYECTOS="src/frontend/agrosmart-frontend src/frontend/chat-microfrontend src/frontend/monitoreo-microfrontend src/frontend/mercados-microfrontend"

          if [ ! -f "src/frontend/agrosmart-frontend/package.json" ] && [ -f "src/frontend/package.json" ]; then
            PROYECTOS="src/frontend"
          fi

          HUBO_PROYECTO=0
          for DIR in $PROYECTOS; do
            if [ -f "$DIR/package.json" ]; then
              HUBO_PROYECTO=1
              echo "=== Validando $DIR ==="
              (cd "$DIR" && npm ci && npm run lint --if-present && npm run build --if-present)
            else
              echo "ℹ️ $DIR no tiene package.json, se omite."
            fi
          done

          if [ "$HUBO_PROYECTO" -eq 0 ]; then
            echo "ℹ️ Ningún proyecto con package.json detectado. Pasando validación de estructura estática."
          fi