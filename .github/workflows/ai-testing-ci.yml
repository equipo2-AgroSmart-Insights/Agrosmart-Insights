name: AI Ops & Prompt Security Testing

on:
  pull_request: {}
  push:
    branches:
      - main
    paths:
      - 'src/ia-ops/**'
      - '.github/workflows/ai-testing-ci.yml'

jobs:
  prompt-security-tests:
    name: Pruebas Unitarias de IA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests pydantic flake8 black

      - name: Flake8 (src/ia-ops)
        run: python -m flake8 src/ia-ops --max-line-length=100 --exclude=__pycache__

      - name: Black --check (src/ia-ops)
        run: python -m black --check src/ia-ops

      - name: Ejecutar PyTest sobre Prompts
        working-directory: src/ia-ops
        run: |
          if [ -d "tests" ] && [ "$(ls -A tests)" ]; then
            pytest tests/ -v --tb=short
          else
            echo "Directorio tests vacío."
          fi
