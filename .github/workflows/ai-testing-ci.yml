name: AI Ops & Prompt Security Testing

on:
  pull_request: {}

  push:
    branches:
      - main
      - BordaAstoray
    paths:
      - 'src/ia-ops/**'
      - '.github/workflows/ai-testing-ci.yml'

jobs:
  prompt-security-tests:
    name: Pruebas de Seguridad de IA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r src/ia-ops/tests/requirements.txt flake8 black

      - name: Flake8
        run: |
          python -m flake8 src/ia-ops \
            --max-line-length=100 \
            --exclude=__pycache__

      - name: Black --check
        run: |
          python -m black --check src/ia-ops

      - name: Ejecutar pruebas Prompt Injection
        working-directory: src/ia-ops/tests
        run: |
          python -m pytest -v -s test_prompt_injections.py