name: AI Ops & Prompt Security Testing

on:
  pull_request: {}
  push:
    branches:
      - main
    paths:
      - 'src/ia-ops/**'
      - '.github/workflows/ai-testing-ci.yml'

jobs:
  prompt-security-tests:
    name: Pruebas Unitarias de IA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r src/ia-ops/tests/requirements.txt flake8 black

      - name: Flake8 (src/ia-ops)
        run: |
          python -m flake8 src/ia-ops \
            --max-line-length=100 \
            --exclude=__pycache__

      - name: Black --check (src/ia-ops)
        run: |
          python -m black --check src/ia-ops

      - name: Ejecutar PyTest sobre Prompts
        working-directory: src/ia-ops
        run: |
          pytest tests/ -v --tb=short


  prompt-security-integration:
    name: Pruebas Prompt Injection contra Render
    runs-on: ubuntu-latest

    # Evitamos ejecutar las pruebas contra Render en PRs
    # provenientes de forks, donde los secrets no están disponibles.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r src/ia-ops/tests/requirements.txt

      - name: Verificar disponibilidad de AgroSmart
        env:
          AGROSMART_WF2_URL: ${{ secrets.AGROSMART_WF2_URL }}
        run: |
          python - <<'PY'
          import os
          import sys
          import time
          import uuid
          import requests

          url = os.getenv("AGROSMART_WF2_URL")

          if not url:
              print("ERROR: AGROSMART_WF2_URL no está configurada.")
              sys.exit(1)

          payload = {
              "session_id": str(uuid.uuid4()),
              "pregunta": "¿Cuál es el precio de la papa en Lima?"
          }

          for attempt in range(1, 5):
              try:
                  response = requests.post(
                      url,
                      json=payload,
                      timeout=60,
                  )

                  print(
                      f"Intento {attempt}: HTTP {response.status_code}"
                  )

                  if response.status_code == 200:
                      print("AgroSmart está disponible.")
                      sys.exit(0)

              except requests.RequestException as exc:
                  print(f"Intento {attempt}: {exc}")

              if attempt < 4:
                  time.sleep(5)

          print("AgroSmart no estuvo disponible.")
          sys.exit(1)
          PY

      - name: Ejecutar pruebas Prompt Injection / Jailbreak
        working-directory: src/ia-ops/tests
        env:
          AGROSMART_WF2_URL: ${{ secrets.AGROSMART_WF2_URL }}
        run: |
          python -m pytest test_wf2_integration.py -v -s