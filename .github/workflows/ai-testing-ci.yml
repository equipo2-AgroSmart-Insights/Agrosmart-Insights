name: AI Ops & Prompt Security Testing

on:
  pull_request:
    paths:
      - 'src/ia-ops/**'
      - '.github/workflows/ai-testing-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'src/ia-ops/**'

jobs:
  prompt-security-tests:
    name: Pruebas Unitarias de IA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests pydantic

      - name: Ejecutar PyTest sobre Prompts
        run: |
          if [ -d "src/ia-ops/tests" ] && [ "$(ls -A src/ia-ops/tests)" ]; then
            pytest src/ia-ops/tests/ -v --tb=short
          else
            echo "Directorio src/ia-ops/tests vacío."
          fi
