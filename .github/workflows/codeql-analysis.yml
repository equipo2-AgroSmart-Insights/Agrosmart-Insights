name: CodeQL (SAST)
# Análisis estático del código propio (no de dependencias — eso lo cubre Dependabot).
# No es un bot: solo reporta hallazgos en la pestaña Security, no abre PRs ni bloquea merges.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # lunes 06:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analizar (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['python', 'javascript-typescript']

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Analizar
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
