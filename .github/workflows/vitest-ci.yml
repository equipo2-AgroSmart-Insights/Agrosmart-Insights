name: Pruebas unitarias con Vitest

on:
  push:
    paths:
      - "src/frontend/agrosmart-frontend/**"
      - ".github/workflows/vitest-ci.yml"

  pull_request:
    paths:
      - "src/frontend/agrosmart-frontend/**"
      - ".github/workflows/vitest-ci.yml"

permissions:
  contents: read

jobs:
  pruebas-unitarias:
    name: Ejecutar pruebas del frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/frontend/agrosmart-frontend

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/agrosmart-frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias
        run: npx vitest run --reporter=tree