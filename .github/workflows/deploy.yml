name: Deploy Sprint 1 — CD Vercel + Render
# Nota: el despliegue real de Vercel/Render ocurre por su integración nativa de Git
# (fuera de este workflow). Los jobs deploy-vercel/deploy-render son disparadores
# opcionales — si faltan los secrets VERCEL_*/RENDER_DEPLOY_HOOK_N8N quedan en
# no-op (exit 0) y aparecen en verde sin haber desplegado nada.

on:
  push:
    branches: [main]
    paths:
      - 'src/frontend/**'
      - 'infrastructure/**'
      - 'src/n8n-workflows/**'
      - 'render.yaml'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/frontend/**'
      - 'infrastructure/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-sprint1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-before-deploy:
    name: Validar artefactos desplegables
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/frontend/agrosmart-frontend/package-lock.json

      - name: Lint y build frontend (Vercel)
        working-directory: src/frontend/agrosmart-frontend
        env:
          VITE_N8N_WEBHOOK_URL: ${{ secrets.VITE_N8N_WEBHOOK_URL }}
        run: |
          export VITE_N8N_WEBHOOK_URL="${VITE_N8N_WEBHOOK_URL:-http://localhost:5678/webhook/v1/query}"
          npm ci
          npm run lint
          npm run build

      - name: Validar workflows n8n versionados
        run: |
          test -f src/n8n-workflows/production/wf0-ingesta-mensual-rag-midagri.json
          test -f src/n8n-workflows/production/wf1-ingesta-diaria-precios-clima.json
          test -f src/n8n-workflows/production/wf2-api-chat-analisis-predictivo.json

      - name: Validar blueprint Render
        run: test -f render.yaml

  deploy-vercel:
    name: Desplegar Frontend en Vercel
    runs-on: ubuntu-latest
    needs: validate-before-deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Vercel CLI
        run: npm install -g vercel@59

      - name: Deploy producción Vercel
        working-directory: src/frontend/agrosmart-frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VITE_N8N_WEBHOOK_URL: ${{ secrets.VITE_N8N_WEBHOOK_URL }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "ℹ️ Configura VERCEL_TOKEN, VERCEL_ORG_ID y VERCEL_PROJECT_ID en GitHub Secrets."
            echo "   Ver docs/sprint-1/SETUP-VERCEL-RENDER.md"
            exit 0
          fi
          vercel deploy --prod --yes --token="$VERCEL_TOKEN" \
            --build-env VITE_N8N_WEBHOOK_URL="$VITE_N8N_WEBHOOK_URL"

      - name: Health check frontend (post-deploy)
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_HEALTH_URL }}
          N8N_URL: ${{ secrets.N8N_HEALTH_URL }}
          PHOENIX_URL: ${{ secrets.PHOENIX_HEALTH_URL }}
        run: |
          if [ -z "$FRONTEND_URL" ] && [ -z "$N8N_URL" ]; then
            echo "ℹ️ Sin FRONTEND_HEALTH_URL / N8N_HEALTH_URL — omitiendo health check."
            exit 0
          fi
          chmod +x infrastructure/scripts/health-check.sh
          infrastructure/scripts/health-check.sh || {
            echo "❌ Health check falló. rollback.sh solo reinicia el stack Docker local — para Vercel usar 'vercel rollback' o redeploy manual desde su dashboard."
            exit 1
          }

  deploy-render:
    name: Disparar deploy Render (n8n)
    runs-on: ubuntu-latest
    needs: validate-before-deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_N8N }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "ℹ️ Configura RENDER_DEPLOY_HOOK_N8N en GitHub Secrets (Render → Service → Deploy Hook)."
            exit 0
          fi
          chmod +x infrastructure/scripts/trigger-render-deploy.sh
          infrastructure/scripts/trigger-render-deploy.sh "$RENDER_DEPLOY_HOOK"

      - name: Health check n8n (post-deploy)
        env:
          N8N_URL: ${{ secrets.N8N_HEALTH_URL }}
          FRONTEND_URL: ${{ secrets.FRONTEND_HEALTH_URL }}
          PHOENIX_URL: ${{ secrets.PHOENIX_HEALTH_URL }}
        run: |
          if [ -z "$N8N_URL" ]; then
            echo "ℹ️ Sin N8N_HEALTH_URL — omitiendo health check n8n."
            exit 0
          fi
          echo "Esperando arranque de n8n en Render..."
          sleep 30
          chmod +x infrastructure/scripts/health-check.sh
          infrastructure/scripts/health-check.sh || {
            echo "❌ n8n no respondió. Revisar logs en Render o ejecutar rollback."
            exit 1
          }

  deploy-via-ssh:
    name: Despliegue Docker vía SSH (alternativa)
    runs-on: ubuntu-latest
    needs: validate-before-deploy
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Desplegar stack con Docker Compose
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -eu
            cd ~/Agrosmart-Insights
            git fetch origin main
            git checkout main
            git pull origin main
            cd infrastructure
            docker compose pull || true
            docker compose up -d
            chmod +x scripts/health-check.sh scripts/rollback.sh
            if ! ./scripts/health-check.sh; then
              echo "Health check falló — ejecutando rollback"
              ./scripts/rollback.sh
              exit 1
            fi
